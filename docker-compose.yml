services:
  db:
    image: postgres:16
    container_name: user_advt_db
    environment:
      POSTGRES_DB: user_advt
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_advt"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    container_name: user_advt_redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "1G"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://redpanda:9092"
    ports:
      - "9092:9092"

  migrate:
    build:
      context: .
    container_name: user_advt_migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    command: ["/app/migrate"]
    restart: on-failure

  app:
    build:
      context: .
    container_name: user_advt_app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  pgdata:
